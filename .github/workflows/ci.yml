name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun test ./src
      - run: bun run format:check
      - run: bun run build
      - name: Pack and import on Node
        run: |
          set -euo pipefail
          tgz=$(npm pack --silent | tail -n 1)
          repo="$PWD"
          work=$(mktemp -d)
          cd "$work"
          npm init -y
          npm install "$repo/$tgz"
          node --input-type=module -e "import { rerankDocuments } from '@corbits/reranking'; if (typeof rerankDocuments !== 'function') process.exit(1)"
